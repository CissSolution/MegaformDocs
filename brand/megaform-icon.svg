<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="chk" x1="292" y1="300" x2="404" y2="412" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#34D399"/>
      <stop offset="1" stop-color="#10B981"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#1e1b4b" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- app tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- back sheet (mega = layered/stacked) -->
  <rect x="196" y="96" width="196" height="284" rx="26" fill="#FFFFFF" opacity="0.30"/>

  <!-- front sheet -->
  <g filter="url(#sh)">
    <rect x="128" y="120" width="196" height="284" rx="26" fill="#FFFFFF"/>
  </g>

  <!-- form fields -->
  <rect x="160" y="164" width="118" height="22" rx="11" fill="#6366F1"/>
  <rect x="160" y="212" width="132" height="16" rx="8" fill="#C7D2FE"/>
  <rect x="160" y="248" width="132" height="16" rx="8" fill="#C7D2FE"/>
  <rect x="160" y="284" width="96"  height="16" rx="8" fill="#C7D2FE"/>

  <!-- submit / success check badge -->
  <circle cx="348" cy="356" r="60" fill="#FFFFFF"/>
  <circle cx="348" cy="356" r="50" fill="url(#chk)"/>
  <path d="M326 356 l14 15 l30 -33" fill="none" stroke="#FFFFFF" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
