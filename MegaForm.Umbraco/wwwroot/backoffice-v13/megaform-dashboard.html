<div class="megaform-v13-host" ng-controller="MegaForm.V13DashboardController as vm">
  <aside class="megaform-v13-sidebar" aria-label="MegaForm navigation">
    <div class="megaform-v13-brand"><span>M</span><strong>MegaForm</strong></div>
    <button type="button" ng-class="{ active: vm.active === 'dashboard' }" ng-click="vm.open('dashboard')">
      <i class="icon-home"></i><span>Dashboard</span>
    </button>
    <div class="megaform-v13-section">
      <div class="megaform-v13-heading"><i class="icon-folder"></i><strong>Forms</strong></div>
      <button type="button" ng-class="{ active: vm.active === 'create' }" ng-click="vm.open('create')">
        <i class="icon-add"></i><span>Create form</span>
      </button>
      <span class="megaform-v13-loading" ng-if="vm.loading">Loading forms...</span>
      <button type="button" class="megaform-v13-form" ng-repeat="form in vm.forms track by form.formId"
              ng-class="{ active: vm.active === 'builder-' + form.formId }"
              ng-click="vm.open('builder', form.formId)">
        <i class="icon-umb-contour"></i><span title="{{ form.title }}">{{ form.title }}</span>
      </button>
    </div>
    <button type="button" ng-class="{ active: vm.active === 'submissions' }" ng-click="vm.open('submissions')">
      <i class="icon-inbox"></i><span>Submissions</span>
    </button>
    <button type="button" ng-class="{ active: vm.active === 'languages' }" ng-click="vm.open('languages')">
      <i class="icon-globe"></i><span>Languages</span>
    </button>
    <button type="button" ng-class="{ active: vm.active === 'settings' }" ng-click="vm.open('settings')">
      <i class="icon-settings"></i><span>Settings</span>
    </button>
  </aside>
  <main class="megaform-v13-main">
    <iframe class="megaform-v13-frame" title="MegaForm" ng-src="{{ vm.frameUrl }}"></iframe>
  </main>
</div>

<style>
  .megaform-v13-host {
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr);
    width: calc(100% + 40px);
    height: calc(100vh - 76px);
    margin: -20px;
    min-height: 520px;
    overflow: hidden;
    background: #f6f7f9;
    border-top: 1px solid #d8d7d9;
  }
  .megaform-v13-sidebar {
    min-width: 0;
    padding: 18px 14px;
    overflow-x: hidden;
    overflow-y: auto;
    background: #fff;
    border-right: 1px solid #d8d7d9;
  }
  .megaform-v13-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 0 8px 16px;
    margin-bottom: 8px;
    border-bottom: 1px solid #e5e7eb;
  }
  .megaform-v13-brand > span {
    display: none;
    align-items: center;
    justify-content: center;
    width: 32px;
    height: 32px;
    border-radius: 6px;
    background: #315efb;
    color: #fff;
    font-weight: 700;
  }
  .megaform-v13-sidebar button,
  .megaform-v13-heading {
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    min-height: 36px;
    padding: 7px 10px;
    border: 0;
    border-radius: 4px;
    background: transparent;
    color: #1f2937;
    font: 500 14px/1.2 Arial, sans-serif;
    text-align: left;
  }
  .megaform-v13-sidebar button { cursor: pointer; }
  .megaform-v13-sidebar button:hover { background: #f3f4f6; }
  .megaform-v13-sidebar button.active { background: #eaf0ff; color: #164bdc; }
  .megaform-v13-sidebar button span {
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .megaform-v13-section { margin: 3px 0 8px; }
  .megaform-v13-heading { font-weight: 700; }
  .megaform-v13-section button { padding-left: 28px; }
  .megaform-v13-section .megaform-v13-form { padding-left: 38px; font-size: 13px; }
  .megaform-v13-loading { display: block; padding: 6px 10px 6px 38px; color: #6b7280; font-size: 12px; }
  .megaform-v13-main { min-width: 0; min-height: 0; background: #f6f7f9; }
  @media (max-width: 900px) {
    .megaform-v13-host { grid-template-columns: 220px minmax(0, 1fr); }
  }

  .megaform-v13-frame {
    display: block;
    width: 100%;
    height: 100%;
    border: 0;
    background: #fff;
  }
</style>
