<!-- [PersonaBar v20260810-F550] E541 plus: the panel HOSTS the dashboard SPA instead of
     sending the admin away to a page that has a MegaForm module on it. MegaForm no longer
     needs a module anywhere to be usable (owner, 2026-08-10).
     Markup only: every value is filled in by scripts/MegaForm.js from
     /API/personaBar/MegaForm/*. Class names follow the Persona Bar's own panels
     (socialpanelheader / socialpanelbody / dnn-ui-common-button) so the panel
     inherits DNN's chrome instead of re-styling it. -->
<!-- socialpanelheader > h3.caption + div.actions is the Persona Bar's own header layout
     (see Dnn.Recyclebin). Using it means the buttons sit where DNN puts every other
     panel's buttons instead of being nudged into place with a negative margin. -->
<div class="socialpanelheader" id="megaform-headerPanel">
    <h3 class="caption" data-mf-resx="PanelTitle">MegaForm</h3>
    <div class="actions">
        <!-- Only visible while the dashboard is mounted: it puts the form list back without
             leaving the panel. -->
        <button type="button" class="mf-pb-back dnn-ui-common-button large mf-pb-hidden" data-mf-resx="BackToForms">Back to forms</button>
        <button type="button" class="mf-pb-dashboard dnn-ui-common-button large" data-mf-resx="OpenDashboard">Open dashboard</button>
        <button type="button" class="mf-pb-new dnn-ui-common-button large" role="primary" data-mf-resx="NewForm">New form</button>
    </div>
</div>

<div class="socialpanelbody mf-pb-body" id="megaform-bodyPanel">

    <div class="mf-pb-alert mf-pb-hidden" role="alert"></div>

    <ul class="mf-pb-stats">
        <li><span class="mf-pb-stat-value" data-mf-stat="forms">&mdash;</span><span class="mf-pb-stat-label" data-mf-resx="StatForms">Forms</span></li>
        <li><span class="mf-pb-stat-value" data-mf-stat="publishedForms">&mdash;</span><span class="mf-pb-stat-label" data-mf-resx="StatPublished">Published</span></li>
        <li><span class="mf-pb-stat-value" data-mf-stat="submissions">&mdash;</span><span class="mf-pb-stat-label" data-mf-resx="StatSubmissions">Submissions</span></li>
        <li><span class="mf-pb-stat-value" data-mf-stat="lastSubmission">&mdash;</span><span class="mf-pb-stat-label" data-mf-resx="StatLastSubmission">Last submission</span></li>
    </ul>

    <!-- Server caps the page size, so the search box is not a nicety: it is how you
         reach a form that is not on the first page. -->
    <div class="mf-pb-toolbar">
        <input type="search" class="mf-pb-search" autocomplete="off"
               placeholder="Search forms by title" aria-label="Search forms by title" />
        <select class="mf-pb-status" aria-label="Filter by status">
            <option value="" data-mf-resx="StatusAll">All statuses</option>
            <option value="Published" data-mf-resx="StatusPublished">Published</option>
            <option value="Draft" data-mf-resx="StatusDraft">Draft</option>
        </select>
    </div>

    <div class="mf-pb-table-wrap" tabindex="0" role="region" aria-label="Forms">
        <table class="mf-pb-table">
            <thead>
                <tr>
                    <!-- A sortable header is a real <button>: keyboard reaches it, screen readers
                         announce aria-sort, and the click target is the whole cell. Fields has no
                         button because the count is parsed from the schema after SQL has already
                         paged the rows - the server cannot order by it, so the panel does not
                         pretend it can. -->
                    <th data-mf-sort="title" aria-sort="none">
                        <button type="button" class="mf-pb-sort" data-mf-resx="ColForm">Form</button>
                    </th>
                    <th class="mf-pb-num mf-pb-fields-col" data-mf-resx="ColFields"
                        title="Counted from the form schema after the page is read, so this column cannot be sorted server-side.">Fields</th>
                    <th class="mf-pb-num mf-pb-subs-col" data-mf-sort="submissions" aria-sort="none">
                        <button type="button" class="mf-pb-sort" data-mf-resx="ColSubmissions">Submissions</button>
                    </th>
                    <th class="mf-pb-modified-col" data-mf-sort="modified" aria-sort="none">
                        <button type="button" class="mf-pb-sort" data-mf-resx="ColModified">Modified</button>
                    </th>
                    <th class="mf-pb-actions-col" data-mf-resx="ColActions">Actions</th>
                </tr>
            </thead>
            <tbody class="mf-pb-rows"></tbody>
        </table>

        <p class="mf-pb-empty mf-pb-hidden" data-mf-resx="NoForms">No forms match this filter.</p>
    </div>

    <div class="mf-pb-pager">
        <button type="button" class="dnn-ui-common-button small mf-pb-prev" data-mf-resx="Previous">Previous</button>
        <span class="mf-pb-pageinfo" aria-live="polite"></span>
        <button type="button" class="dnn-ui-common-button small mf-pb-next" data-mf-resx="Next">Next</button>
    </div>

    <!-- [PbHostsDashboard v20260810-F550] Where the dashboard SPA mounts.
         #mf-dashboard-root and its data-* are the contract the bundle already reads
         (MegaForm.UI/src/shared/platform-host.ts readRootCfg + FormView.ascx's own root).
         data-module-id and data-tab-id are deliberately absent: measured 2026-08-10, a tabid of
         0 makes DNN 404 the request and a ModuleId/TabId header pair of 0 makes it 400, while
         sending nothing works for every endpoint the dashboard needs
         (tools/browser-qa/pb-module-context-probe.mjs). The script sets data-portal-id and
         data-api-base before it loads the bundle. -->
    <div class="mf-pb-dashhost mf-pb-hidden">
        <div id="mf-dashboard-root"
             data-platform="dnn"
             data-assets-base="/DesktopModules/MegaForm/Assets/"
             data-form-id="0">
            <div class="mf-pb-dashboot" data-mf-resx="LoadingDashboard">Loading the dashboard…</div>
        </div>
    </div>
</div>
